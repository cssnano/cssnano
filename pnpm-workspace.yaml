packages:
  - 'packages/**'
  - '!site/**'
autoInstallPeers: true
hoist: false
hoistWorkspacePackages: false

catalog:
  autoprefixer: ^10.7.0
  browserslist: ^4.29.6
  caniuse-lite: ^1.0.30001826
  '@csstools/css-tokenizer': ^4.0.3
  postcss: ^8.5.33
  '@webref/css': 8.7.8
  mdn-data: 2.37.2
  '@colordx/core': ^7.3.0
  '@mdn/browser-compat-data': ^8.1.9

minimumReleaseAgeExclude:
  - postcss-calc

versioning:
  changelog:
    storage: repository
