packages:
  - 'packages/**'
  - '!site/**'
autoInstallPeers: true

catalog:
  autoprefixer: ^10.6.1
  browserslist: ^4.29.0
  '@csstools/css-tokenizer': ^4.0.1
  postcss: ^8.5.28
  '@webref/css': 8.7.5
  mdn-data: 2.36.0
  '@colordx/core': ^7.2.0

minimumReleaseAgeExclude:
  - postcss-calc
  - '@colordx/core@7.2.0'

versioning:
