name: performance
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled]

jobs:
  benchmark:
    name: Advisory performance comparison
    if: github.event.label.name == 'performance'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true

      - name: Create isolated revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/cssnano-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/cssnano-head" "$HEAD_SHA"

      - name: Use candidate benchmark harness for base revision
        env:
          BASE_DIR: ${{ runner.temp }}/cssnano-base
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C "$BASE_DIR" checkout "$HEAD_SHA" -- \
            util/benchmark

      - name: Install dependencies in both revisions
        run: |
          pnpm --dir "$RUNNER_TEMP/cssnano-base" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/cssnano-head" install --frozen-lockfile

      - name: Benchmark target blocks in alternating order
        env:
          NODE_ENV: production
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/base-results" "$RUNNER_TEMP/head-results"
          targets=(default advanced lite selector-reduction longhand-rule-merging ordered-value-normalization)
          for index in "${!targets[@]}"; do
            target="${targets[$index]}"
            if [[ "$target" == selector-reduction || "$target" == longhand-rule-merging || "$target" == ordered-value-normalization ]]; then
              target_args=(--case="$target" --preset=default)
            else
              target_args=(--preset="$target")
            fi
            if (( index % 2 == 0 )); then
              first=base
              second=head
            else
              first=head
              second=base
            fi
            if [[ "$first" == base ]]; then
              first_revision="$BASE_SHA"
              second_revision="$HEAD_SHA"
            else
              first_revision="$HEAD_SHA"
              second_revision="$BASE_SHA"
            fi
            pnpm --dir "$RUNNER_TEMP/cssnano-$first" bench -- "${target_args[@]}" --revision="$first_revision" --label="$first-$target" --results-dir="$RUNNER_TEMP/$first-results"
            pnpm --dir "$RUNNER_TEMP/cssnano-$second" bench -- "${target_args[@]}" --revision="$second_revision" --label="$second-$target" --results-dir="$RUNNER_TEMP/$second-results"
          done

      - name: Compare benchmarks
        run: |
          mkdir -p "$RUNNER_TEMP/performance"
          : > "$RUNNER_TEMP/performance/comparison.md"
          for target in default advanced lite selector-reduction longhand-rule-merging ordered-value-normalization; do
            node util/benchmark/compare-bench.mjs "$RUNNER_TEMP/base-results/base-$target.json" "$RUNNER_TEMP/head-results/head-$target.json" --markdown="$RUNNER_TEMP/performance/$target.md" | tee -a "$RUNNER_TEMP/performance/comparison.txt"
            cat "$RUNNER_TEMP/performance/$target.md" >> "$RUNNER_TEMP/performance/comparison.md"
          done
          cat "$RUNNER_TEMP/performance/comparison.md" >> "$GITHUB_STEP_SUMMARY"
