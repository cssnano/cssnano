name: performance
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled]

jobs:
  benchmark:
    name: Advisory performance comparison
    if: github.event.label.name == 'performance'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true

      - name: Create isolated revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/cssnano-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/cssnano-head" "$HEAD_SHA"

      - name: Use candidate benchmark harness for base revision
        env:
          BASE_DIR: ${{ runner.temp }}/cssnano-base
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C "$BASE_DIR" checkout "$HEAD_SHA" -- \
            util/benchmark .github/workflows/performance.yml

      - name: Install dependencies in both revisions
        run: |
          pnpm --dir "$RUNNER_TEMP/cssnano-base" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/cssnano-head" install --frozen-lockfile

      - name: Run balanced comparison blocks
        env:
          NODE_ENV: production
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          comparison_failure=0
          mkdir -p "$RUNNER_TEMP/comparison-results"
          targets=(default advanced lite selector-reduction longhand-rule-merging ordered-value-normalization)
          for target in "${targets[@]}"; do
            if [[ "$target" == selector-reduction || "$target" == longhand-rule-merging || "$target" == ordered-value-normalization ]]; then
              target_args=(--case="$target" --preset=default)
            else
              target_args=(--preset="$target")
            fi
            if ! node util/benchmark/compare-revisions.mjs \
              --base-dir="$RUNNER_TEMP/cssnano-base" \
              --candidate-dir="$RUNNER_TEMP/cssnano-head" \
              --base-revision="$BASE_SHA" \
              --candidate-revision="$HEAD_SHA" \
              --results-dir="$RUNNER_TEMP/comparison-results/$target" \
              --blocks=20 --minimum-blocks=5 --requested-blocks=20 \
              "${target_args[@]}"; then
              comparison_failure=1
              echo "structural or execution failure for $target; raw evidence retained"
            fi
          done
          exit "$comparison_failure"

      - name: Compare benchmarks and write advisory reports
        if: always()
        env:
          RESULTS_DIR: ${{ runner.temp }}/comparison-results
          PERFORMANCE_DIR: ${{ runner.temp }}/performance
        run: |
          report_failure=0
          mkdir -p "$PERFORMANCE_DIR"
          : > "$PERFORMANCE_DIR/comparison.md"
          for target in default advanced lite selector-reduction longhand-rule-merging ordered-value-normalization; do
            artifact="$RESULTS_DIR/$target/comparison-v3.json"
            report="$PERFORMANCE_DIR/$target.md"
            if [[ -f "$artifact" ]] && node util/benchmark/compare-bench.mjs "$artifact" --markdown="$report" | tee -a "$PERFORMANCE_DIR/comparison.txt"; then
              cat "$report" >> "$PERFORMANCE_DIR/comparison.md"
            else
              report_failure=1
              printf '## %s\n\n> Structural failure: no validated v3 evidence was available.\n\n' "$target" > "$report"
              cat "$report" >> "$PERFORMANCE_DIR/comparison.md"
            fi
          done
          cat "$PERFORMANCE_DIR/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$report_failure"

      - name: Upload raw comparison artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-comparisons
          path: |
            ${{ runner.temp }}/comparison-results
            ${{ runner.temp }}/performance
