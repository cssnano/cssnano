name: Deploy website

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the website source.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: false

      - name: Install production dependencies
        run: pnpm install --prod --frozen-lockfile

      - name: Install website dependencies
        run: pnpm --dir site install --frozen-lockfile

      - name: Build playground
        run: pnpm --dir site webpack

      - name: Build website
        run: pnpm --dir site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/_site

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-slim
    permissions:
      pages: write # Required to publish the generated artifact to GitHub Pages.
      id-token: write # Required to authenticate with GitHub Pages via OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
