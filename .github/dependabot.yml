version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      lint-and-website:
        patterns:
          - "oxfmt"
          - "oxlint"
          - "knip"
          - "astro"
          - "@astrojs/sitemap"
      browser-data-and-parsing:
        patterns:
          - "caniuse-lite"
          - "jsdom"
          - "postcss-selector-parser"
    ignore:
      - dependency-name: "@mdn/browser-compat-data"
      - dependency-name: "@webref/css"
      - dependency-name: "mdn-data"
    versioning-strategy: increase
    
