version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      lint-and-website:
        patterns:
          - "oxfmt"
          - "oxlint"
          - "knip"
          - "astro"
    versioning-strategy: increase
    
